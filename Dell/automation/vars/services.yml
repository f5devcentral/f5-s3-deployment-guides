        - { name: dell_node_15, address: 172.16.0.175, port: 9021 }
        - { name: dell_node_16, address: 172.16.0.176, port: 9021 }
        - { name: dell_node_17, address: 172.16.0.177, port: 9021 }
        - { name: dell_node_18, address: 172.16.0.178, port: 9021 }
        - { name: dell_node_19, address: 172.16.0.179, port: 9021 }
        - { name: dell_node_20, address: 172.16.0.180, port: 9021 }
        - { name: dell_node_21, address: 172.16.0.181, port: 9021 }
        - { name: dell_node_22, address: 172.16.0.182, port: 9021 }
        - { name: dell_node_23, address: 172.16.0.183, port: 9021 }
        - { name: dell_node_24, address: 172.16.0.184, port: 9021 }
        - { name: dell_node_25, address: 172.16.0.185, port: 9021 }
        - { name: dell_node_26, address: 172.16.0.186, port: 9021 }
        - { name: dell_node_27, address: 172.16.0.187, port: 9021 }
