        - { name: dell_node_15, address: 172.16.0.175, port: 9020 }
        - { name: dell_node_16, address: 172.16.0.176, port: 9020 }
        - { name: dell_node_17, address: 172.16.0.177, port: 9020 }
        - { name: dell_node_18, address: 172.16.0.178, port: 9020 }
        - { name: dell_node_19, address: 172.16.0.179, port: 9020 }
        - { name: dell_node_20, address: 172.16.0.180, port: 9020 }
        - { name: dell_node_21, address: 172.16.0.181, port: 9020 }
        - { name: dell_node_22, address: 172.16.0.182, port: 9020 }
        - { name: dell_node_23, address: 172.16.0.183, port: 9020 }
        - { name: dell_node_24, address: 172.16.0.184, port: 9020 }
        - { name: dell_node_25, address: 172.16.0.185, port: 9020 }
        - { name: dell_node_26, address: 172.16.0.186, port: 9020 }
        - { name: dell_node_27, address: 172.16.0.187, port: 9020 }
        - { name: dell_node_28, address: 172.16.0.188, port: 9020 }
        - { name: dell_node_29, address: 172.16.0.189, port: 9020 }
        - { name: dell_node_30, address: 172.16.0.190, port: 9020 }
        - { name: dell_node_31, address: 172.16.0.191, port: 9020 }
        - { name: dell_node_32, address: 172.16.0.192, port: 9020 }

  # ---------------------------------------------------------------------------
  # Encrypted path: HTTPS (TLS) from S3 client to BIG-IP, re-encrypted to OBS
  # (9021). The VS terminates client TLS with clientssl-dell-profile and
  # initiates a new TLS session to the nodes with serverssl-dell-profile.
  # Shares the same nodes as the HTTP service above (a BIG-IP node is keyed by
  # address, so the names match and only the pool member port differs).
  # ---------------------------------------------------------------------------
  - name: dell_s3_https_cluster
    tenant: Common
    virtual_server:
      destination: 100.1.1.182
      port: 443
      profiles:
        - { name: s3-tcp-custom-client, context: client-side }
        - { name: s3-tcp-custom-server, context: server-side }
        - http
        - { name: clientssl-dell-profile, context: client-side }
        - { name: serverssl-dell-profile, context: server-side }
      snat: automap
    pool:
      lb_method: least-connections-member
      monitor: https
      members:
        - { name: dell_node_01, address: 172.16.0.161, port: 9021 }
        - { name: dell_node_02, address: 172.16.0.162, port: 9021 }
        - { name: dell_node_03, address: 172.16.0.163, port: 9021 }
        - { name: dell_node_04, address: 172.16.0.164, port: 9021 }
        - { name: dell_node_05, address: 172.16.0.165, port: 9021 }
        - { name: dell_node_06, address: 172.16.0.166, port: 9021 }
        - { name: dell_node_07, address: 172.16.0.167, port: 9021 }
        - { name: dell_node_08, address: 172.16.0.168, port: 9021 }
