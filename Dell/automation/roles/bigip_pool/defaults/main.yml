---
pool_state: present
default_lb_method: round-robin
default_monitor: http
# Per-member concurrent connection cap (guide 2.3.1). 0 = unlimited.
# Override per member with `connection_limit:` in vars/services.yml.
default_member_connection_limit: 1000
# pool_name_suffix is defined in inventories/.../group_vars/all.yml
# (shared with bigip_virtual_server).
